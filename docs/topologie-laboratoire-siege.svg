<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1010" viewBox="0 0 1440 1010" role="img" aria-labelledby="title desc">
<title id="title">Topologie actuelle du laboratoire ALPINA RETAIL au siège de Grenoble</title>
<desc id="desc">Internet, NAT VMware VMnet8, pare-feu pfSense avec LAN 10.10.10.1, VMnet1 Host-only, serveur DC1-GRE-SIEGE 10.10.10.10 avec Active Directory, DNS et DHCP, et client Windows 11 PC-TEST-GRE 10.10.10.20 configuré initialement en statique. Le client a reçu un bail DHCP 10.10.10.100, rejoint le domaine et reçu une GPO de verrouillage à 900 secondes, dont l'effet chronométré reste non testé.</desc>
